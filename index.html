<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OPD Daily Report</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f7f6; padding: 20px; }
        .card { margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .header-title { color: #2c3e50; border-bottom: 2px solid #18bc9c; margin-bottom: 20px; }
    </style>
</head>
<body>

<div class="container">
    <h2 class="header-title">🏥 บันทึกรายงานประจำวัน OPD</h2>
    
    <form id="opdForm">
        <!-- 1. สถิติการคัดกรอง -->
        <div class="card p-3">
            <h5>1. สถิติการคัดกรอง</h5>
            <div class="row g-2">
                <div class="col-6">ซักประวัติทั่วไป: <input type="number" name="scr_gen" class="form-control" value="0"></div>
                <div class="col-6">จุดรถนั่ง/นอน: <input type="number" name="scr_wheel" class="form-control" value="0"></div>
                <div class="col-6">คลินิกพิเศษ: <input type="number" name="scr_spec" class="form-control" value="0"></div>
                <div class="col-6">จุด 99: <input type="number" name="scr_99" class="form-control" value="0"></div>
            </div>
        </div>

        <!-- 2. การจัดการเร่งด่วน -->
        <div class="card p-3">
            <h5>2. การจัดการเร่งด่วน</h5>
            <div class="row g-2">
                <div class="col-6">Fast track OPD: <input type="number" name="fast_track" class="form-control" value="0"></div>
                <div class="col-6">ส่ง ER: <input type="number" name="send_er" class="form-control" value="0"></div>
            </div>
        </div>

        <!-- 5. แยกตามสาขา -->
        <div class="card p-3">
            <h5>5. ผู้ป่วยแยกตามสาขา</h5>
            <div class="row g-2">
                <div class="col-4">Med: <input type="number" name="med" class="form-control" value="0"></div>
                <div class="col-4">Ortho: <input type="number" name="ortho" class="form-control" value="0"></div>
                <div class="col-4">Ped: <input type="number" name="ped" class="form-control" value="0"></div>
                <div class="col-4">นรีเวช: <input type="number" name="obgyn" class="form-control" value="0"></div>
                <div class="col-4">ศัลยกรรม: <input type="number" name="sur" class="form-control" value="0"></div>
            </div>
        </div>

        <button type="submit" class="btn btn-success w-100 p-3 mb-2">💾 บันทึกข้อมูลลง Google Sheets</button>
        <button type="button" onclick="copyToLine()" class="btn btn-primary w-100 p-3">📋 สรุปรายงานสำหรับ LINE</button>
    </form>
</div>

<script>
    // ส่วนของการส่งข้อมูลไป Google Sheets
    const scriptURL = 'YOUR_GOOGLE_SCRIPT_URL_HERE'; // ต้องเอา URL จาก Google Script มาใส่
    const form = document.getElementById('opdForm');

    form.addEventListener('submit', e => {
        e.preventDefault();
        fetch(scriptURL, { method: 'POST', body: new FormData(form)})
        .then(response => alert("บันทึกข้อมูลเรียบร้อยแล้ว!"))
        .catch(error => console.error('Error!', error.message));
    });

    function copyToLine() {
        const d = new FormData(form);
        let text = `📌 รายงาน OPD วันนี้\n- คัดกรองรวม: ${Number(d.get('scr_gen')) + Number(d.get('scr_wheel'))}\n- Admit: ${d.get('fast_track')}\n- Med: ${d.get('med')}`;
        navigator.clipboard.writeText(text);
        alert("ก๊อปปี้ข้อความแล้ว วางใน LINE ได้เลย");
    }
</script>

</body>
</html>
